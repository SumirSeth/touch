name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: powershell -ExecutionPolicy Bypass -File app/scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/installers/**/*.exe
            target/installers/**/*.msi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/installers/**/*.exe
            target/installers/**/*.msi

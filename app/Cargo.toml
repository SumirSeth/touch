[package]
name = "touch"
version.workspace = true
edition = "2024"
build = "build.rs"
[dependencies]
async-channel = "2"
futures-lite = "2"
gestures_engine = { path = "../crates/engine" }
gpui = "=0.2.2"
gpui-component = "=0.5.1"
tray-icon = "0.21"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
serde_json = "1"
[build-dependencies]
winres = "0.1"
[[bin]]
name = "touch"
path = "src/main.rs"
test = false
bench = false
